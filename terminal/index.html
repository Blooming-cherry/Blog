<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adaydream Terminal — 导航</title>
<link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
<meta name="description" content="adaydream.cn 主站导航：Blog、Sonnet 与 GitHub 个人仓库入口。">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0d0d0d">
<style>
  ::selection { background: #e3ea9d; }

  body, html { width: 100%; height: 100%; margin: 0; padding: 0; }
  html { font-size: 15px; }
  @media (max-height:768px),(max-width:768px) { html { font-size: 11px; } }

  img, svg { max-width: 100%; height: auto; }

  :root { color-scheme: light; }
  .PhoneIntro { display: none; }
  @keyframes phoneCrestIn {
    from { opacity: 0; transform: translateY(12px) scale(.94); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes phoneTextIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .Home {
    width: 100vw; height: 100vh;
    position: absolute; top: 0; left: 0;
    scrollbar-width: none;
    overflow-x: hidden; overflow-y: scroll;
    background: #0d0d0d;
    font-family: system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .Home::-webkit-scrollbar { display: none; }

  .TopBar {
    position: fixed; top: 0; right: 0; left: 0;
    height: 4.8rem;
    background: #000;
    z-index: 1000;
    display: flex;
    align-items: stretch;
    user-select: none;
    animation: topBarIn 1.2s ease-out;
  }
  .TopBar .Left { display: flex; align-items: stretch; padding: 0 3.2rem; }
  .TopBar .Left .Logo {
    display: flex; align-items: center;
    margin-right: 2.8rem; padding: 0 1.2rem;
  }
  .TopBar .Left .Logo .Image {
    height: 2.52rem; aspect-ratio: 1;
    transform: translateY(-0.16rem);
  }
  .TopBar .Left .Logo .Text {
    color: #fff; font-size: 1.36rem; font-weight: 500;
    white-space: nowrap; margin-left: 0.6rem;
  }
  .TopBar .Right { display: flex; align-items: stretch; padding: 0 3.2rem; }
  .TopBar .Button {
    display: flex; align-items: center;
    padding: 0 1.6rem; color: #fff;
    font-weight: 100; cursor: pointer;
    white-space: nowrap; border: none; background: none;
    font-size: 1rem; transition: background 0.2s;
  }
  .TopBar .Button:hover { background: #131313; }
  .TopBar .Button .Image { height: 1.3rem; margin-left: 0.5rem; }
  .TopBar .Placeholder { flex-grow: 1; }
  .TopBar .PlaceholderMiddle { flex-grow: 7; min-width: 2.4rem; }
  @keyframes topBarIn {
    0% { top: -4.8rem; opacity: 0; }
    90% { top: -4.8rem; opacity: 0; }
    to { top: 0; opacity: 1; }
  }

  .Cover {
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    display: flex; align-items: center;
    background: #0d0d0d;
    animation: coverBackgroundIn 1.5s ease-out;
  }
  @keyframes coverBackgroundIn {
    0% { background: #000; }
    82% { background: #000; }
    to { background: #0d0d0d; }
  }

  .Cover .Content {
    width: 100%; height: auto;
    aspect-ratio: 3.8;
    display: flex; align-items: stretch;
    background: #eef0db; overflow: hidden;
    transform: translateY(1rem);
    animation: contentDown 1.7s ease-in-out;
  }
  @keyframes contentDown {
    0% { transform: translateY(0); }
    40% { transform: translateY(0); }
    to { transform: translateY(1rem); }
  }

  /* ── Left Column ── */
  .Cover .Content .Left {
    position: relative;
    z-index: 2;
    flex-grow: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    position: relative;
  }
  .Cover .Content .Left .Title {
    position: absolute; top: 7.5vmax;
    font-size: 2vmax; font-weight: 700;
    animation: titleIn 1.1s ease-out;
  }
  .Cover .Content .Left .Tip {
    position: absolute; top: 10vmax;
    font-size: .8vmax; margin-top: .2vmax;
    color: #555;
    animation: tipIn 1.3s ease-out;
  }
  .Cover .Content .Left .Buttons {
    position: absolute; top: 14vmax;
    display: flex; margin-top: 1.6vmax;
    animation: buttonsIn 1.5s ease-in-out;
  }
  .Cover .Content .Left .Buttons .Button {
    margin: .6vmax; padding: .5vmax 1.2vmax;
    font-size: .7vmax; border-radius: .2vmax;
    cursor: pointer; user-select: none;
    transition: box-shadow 0.3s ease;
  }
  .Cover .Content .Left .Buttons .Button:hover {
    box-shadow: 0 0 1.2vmax .6vmax rgba(0,0,0,0.067);
  }
  .Cover .Content .Left .Buttons .QuickStart {
    background: #000; color: #fff;
  }
  .Cover .Content .Left .Buttons .BrowserExample {
    border: 1px solid #000;
  }
  @keyframes titleIn {
    0% { clip-path: polygon(0 0, 8vmax 0, 0 8vmax); transform: translateY(2.5vmax); }
    20% { clip-path: polygon(0 0, 16vmax 0, 0 16vmax); transform: translateY(2.5vmax); }
    85% { clip-path: polygon(0 0, 16vmax 0, 0 16vmax); transform: translateY(2.5vmax); animation-timing-function: ease-out; }
    to { clip-path: polygon(0 0, 16vmax 0, 0 16vmax); transform: translateY(0); animation-timing-function: ease-out; }
  }
  @keyframes tipIn {
    0% { clip-path: polygon(0 0, 0 0, 0 0); transform: translateY(2.5vmax); }
    10% { clip-path: polygon(0 0, 0 0, 0 0); transform: translateY(2.5vmax); }
    40% { clip-path: polygon(0 0, 25vmax 0, 0 25vmax); transform: translateY(2.5vmax); }
    85% { clip-path: polygon(0 0, 25vmax 0, 0 25vmax); transform: translateY(2.5vmax); animation-timing-function: ease-out; }
    to { clip-path: polygon(0 0, 25vmax 0, 0 25vmax); transform: translateY(0); animation-timing-function: ease-out; }
  }
  @keyframes buttonsIn {
    0% { transform: translateY(1vmax); opacity: 0; }
    90% { transform: translateY(1vmax); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  /* ── Middle Column ── */
  .Cover .Content .Middle {
    position: relative;
    z-index: 2;
    height: 100%; aspect-ratio: 1;
  }
  .Center {
    width: 100%; height: 100%;
    display: grid; place-items: center;
  }
  .Center > * {
    width: 100%; height: 100%;
    grid-area: 1/1;
  }
  .Center .Circle { border-radius: 50%; }
  .Center .CircleA {
    width: 105%; height: 105%;
    background: #cccfa6;
    box-shadow: 0 0 2vmax 1.7vmax #cccfa6;
    animation: fadeInScaleA 2s ease-out;
  }
  .Center .CircleB {
    width: 77%; height: 77%;
    background: #000;
    box-shadow: 0 0 3vmax 3vmax #000;
    animation: fadeInScaleA 2.2s ease-out;
  }
  .Center .CircleC {
    width: 13%; height: 13%;
    background: #000;
    box-shadow: 0 0 6.7vmax 7vmax #000;
    z-index: 1;
    animation: fadeInScaleC 2.5s ease-out;
  }
  @keyframes fadeInScaleA {
    0% { opacity: 0; transform: scale(.5); }
    25% { opacity: 1; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes fadeInScaleC {
    0% { opacity: .7; transform: scale(.7); }
    25% { opacity: .8; transform: scale(.7); }
    50% { opacity: .9; transform: scale(.9); }
    to { opacity: 1; transform: scale(1); }
  }

  .Center .Line { z-index: 1; }
  .Center .LineA { animation: fadeInLineA 2s linear; }
  .Center .LineB { animation: fadeInLineB 2s linear; }
  .Center .LineC { animation: fadeInLineC 2s linear; }
  .Center .LineD { animation: fadeInLineD .3s linear; }
  .Center .LineM { animation: fadeInLineM .3s linear; }
  @keyframes fadeInLineA {
    0% { clip-path: inset(0 0 100% 0); }
    90% { clip-path: inset(0 0 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes fadeInLineB {
    0% { clip-path: inset(0 0 100% 0); }
    60% { clip-path: inset(0 0 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes fadeInLineC {
    0% { clip-path: inset(0 0 100% 0); }
    75% { clip-path: inset(0 0 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes fadeInLineD {
    0% { clip-path: inset(40% 0 0 0); }
    to { clip-path: inset(0 0 0 0); }
  }
  @keyframes fadeInLineM {
    0% { clip-path: inset(0 0 50% 0); }
    70% { clip-path: inset(0 0 10% 0); }
    to { clip-path: inset(0 0 0 0); }
  }

  /* Blocks — 5×5 grid, rotated 45° */
  .Blocks {
    width: 100%; height: 100%;
    transform: rotate(45deg) scale(.7071);
    display: grid;
    grid-template-columns: repeat(5, 20%);
    grid-template-rows: repeat(5, 20%);
  }
  .Blocks .Block {
    margin: .27rem;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 1s ease-in-out;
  }
  .Blocks .Visible {
    background: #fff;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), 0 0 .3vmax rgba(0,0,0,.12);
    opacity: .85;
  }
  .Blocks .Block:nth-child(13) {
    background: #FFB22E;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 0 .5vmax rgba(255,178,46,.3);
    opacity: .92;
    animation: blockHighlight 2.4s ease-in-out 0s infinite;
  }
  /* Block pulse — staggered */
  .Blocks .Visible:nth-child(1)  { animation: blockPulse 3.2s ease-in-out 0s infinite; }
  .Blocks .Visible:nth-child(3)  { animation: blockPulse 2.8s ease-in-out .4s infinite; }
  .Blocks .Visible:nth-child(5)  { animation: blockPulse 3.6s ease-in-out .8s infinite; }
  .Blocks .Visible:nth-child(7)  { animation: blockPulse 3.0s ease-in-out .3s infinite; }
  .Blocks .Visible:nth-child(8)  { animation: blockPulse 3.4s ease-in-out .7s infinite; }
  .Blocks .Visible:nth-child(12) { animation: blockPulse 2.6s ease-in-out 1.1s infinite; }
  .Blocks .Visible:nth-child(15) { animation: blockPulse 3.8s ease-in-out .5s infinite; }
  .Blocks .Visible:nth-child(18) { animation: blockPulse 2.9s ease-in-out .9s infinite; }
  .Blocks .Visible:nth-child(21) { animation: blockPulse 3.3s ease-in-out .2s infinite; }
  .Blocks .Visible:nth-child(23) { animation: blockPulse 3.1s ease-in-out .6s infinite; }
  .Blocks .Visible:nth-child(25) { animation: blockPulse 2.7s ease-in-out 1.0s infinite; }
  @keyframes blockPulse {
    0%, to { opacity: .65; transform: scale(1); }
    30% { opacity: .95; transform: scale(1.1); }
    60% { opacity: .75; transform: scale(.95); }
  }
  @keyframes blockHighlight {
    0%, to { opacity: .75; transform: scale(1); }
    25% { opacity: 1; transform: scale(1.18); }
    50% { opacity: .8; transform: scale(.92); }
    75% { opacity: .95; transform: scale(1.08); }
  }

  /* ── Right Column ── */
  .Cover .Content .Right {
    position: relative;
    z-index: 2;
    flex-grow: 1;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    position: relative;
  }
  .Cover .Content .Right .Title {
    position: absolute; top: 7.5vmax; left: 10vmax;
    font-size: 1.5vmax; font-weight: 700;
    animation: whyIn 1.8s ease-out;
  }
  .Cover .Content .Right .TextHolder {
    position: absolute; top: 13vmax; left: 10.3vmax;
    animation: textIn 2s ease-out;
  }
  .Cover .Content .Right .TextHolder .Text {
    font-size: .8vmax; margin: .2vmax 0; color: #555;
  }
  @keyframes whyIn {
    0% { clip-path: polygon(0 0, 0 0, 0 0); }
    30% { clip-path: polygon(0 0, 0 0, 0 0); }
    40% { clip-path: polygon(0 0, 20vmax 0, 0 20vmax); }
    to { clip-path: polygon(0 0, 20vmax 0, 0 20vmax); }
  }
  @keyframes textIn {
    0% { clip-path: polygon(0 0, 0 0, 0 0); }
    28% { clip-path: polygon(0 0, 0 0, 0 0); }
    38% { clip-path: polygon(0 0, 18vmax 0, 0 18vmax); }
    to { clip-path: polygon(0 0, 18vmax 0, 0 18vmax); }
  }

  /* ── Rhine Lab Logo — solid-fill ribbon draw-in (MP4 reference), brand green ── */
  .RhineLogoWrap {
    position: absolute;
    top: 3.2vmax;
    left: 14%;
    width: 14vmax;
    height: auto;
    z-index: 1;
    pointer-events: none;
  }
  .RhineLogoWrap svg { width: 100%; height: auto; display: block; }

  /* Ribbon draw-in: a thick white stroke sweeps along the body outline,
     revealing the solid-filled logo through the draw mask */
  /* Hand-drawn pen: butt-capped mask strokes; a round "pen dot" rides the
     tip via JS so the reveal front looks like a single pen line, not a blob */
  .RhineLogoWrap .drawPath {
    fill: none;
    stroke: #fff;
    stroke-width: 90;
    stroke-linecap: butt;
    stroke-linejoin: round;
  }
  .RhineLogoWrap .penDot { fill: #fff; }

  /* Plus / Minus / Text stay hidden until JS reveals them (slow finale) */
  .RhineLogoWrap .logoPlus,
  .RhineLogoWrap .logoMinus { opacity: 0; }
  .RhineLogoWrap .logoText { opacity: 0; }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .TopBar .Placeholder { flex-grow: 0.2; }
    .TopBar .PlaceholderMiddle { flex-grow: 2; }
    .TopBar .Left { padding: 0 1rem; }
    .TopBar .Right { padding: 0 1rem; }
    .TopBar .Left .Logo { margin-right: 0.8rem; }
    .TopBar .Left .Logo .Text { font-size: 1.1rem; }
    .TopBar .Button { padding: 0 .8rem; font-size: .9rem; }

    /* 纵向堆叠：标题/按钮 → 中心图形 → GitHub 文案 */
    .Cover .Content { aspect-ratio: auto; flex-direction: column; height: auto; }

    /* 桌面端水印 logo 在窄屏隐藏（顶栏已带 RHINE LAB 品牌） */
    .RhineLogoWrap { display: none; }

    .Cover .Content .Left,
    .Cover .Content .Middle,
    .Cover .Content .Right {
      box-sizing: border-box;
      flex: 0 0 auto; min-width: 0; width: 100%; min-height: auto;
    }

    .Cover .Content .Left {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 2.5rem 1.5rem 0.5rem;
    }
    .Cover .Content .Left .Title,
    .Cover .Content .Left .Tip,
    .Cover .Content .Left .Buttons { position: static; top: auto; left: auto; }
    .Cover .Content .Left .Title {
      font-size: clamp(24px, 7vw, 48px);
      margin: 0 0 .5rem;
      animation: fadeInMobile 1.1s ease-out;
    }
    .Cover .Content .Left .Tip {
      font-size: clamp(13px, 3.4vw, 20px);
      margin: 0 0 1.2rem;
      animation: fadeInMobile 1.3s ease-out;
    }
    .Cover .Content .Left .Buttons {
      flex-wrap: wrap; justify-content: center; gap: .7rem; margin: 0;
      animation: fadeInMobile 1.5s ease-out;
    }
    .Cover .Content .Left .Buttons .Button {
      font-size: clamp(14px, 3.5vw, 18px);
      padding: .55em 1.6em;
    }

    .Cover .Content .Middle {
      width: min(80vw, 420px);
      height: auto; aspect-ratio: 1;
      margin: 1.2rem auto;
      overflow: hidden;
    }

    .Cover .Content .Right {
      display: flex; flex-direction: column;
      justify-content: center; align-items: center; text-align: center;
      padding: 1rem 1.5rem 3rem;
    }
    .Cover .Content .Right .Title,
    .Cover .Content .Right .TextHolder { position: static; top: auto; left: auto; }
    .Cover .Content .Right .Title {
      font-size: clamp(18px, 5vw, 30px);
      margin: 0 0 .8rem;
      animation: fadeInMobile 1.8s ease-out;
    }
    .Cover .Content .Right .TextHolder {
      display: flex; flex-direction: column; gap: .5rem;
      animation: fadeInMobile 2s ease-out;
    }
    .Cover .Content .Right .TextHolder .Text { font-size: clamp(13px, 3vw, 17px); }

    @keyframes fadeInMobile {
      0% { opacity: 0; }
      40% { opacity: 0; }
      to { opacity: 1; }
    }
  }
  @media (max-width: 480px) {
    html { font-size: 13px; }
    .TopBar { height: 3.8rem; }
    .TopBar .Placeholder { display: none; }
    .TopBar .PlaceholderMiddle { flex-grow: 0.5; }
    .TopBar .Left { padding: 0 .6rem; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .TopBar .Left::-webkit-scrollbar { display: none; }
    .TopBar .Left .Logo { margin-right: .4rem; padding: 0 .4rem; }
    .TopBar .Left .Logo .Image { height: 2rem; }
    .TopBar .Left .Logo .Text { font-size: 1rem; }
    .TopBar .Left .Button { padding: 0 .5rem; font-size: .8rem; }
    .TopBar .Right { padding: 0 .6rem; }
    .TopBar .Right .Button { padding: 0 .5rem; font-size: .8rem; }
    .TopBar .Left .Button:nth-child(2),
    .TopBar .Left .Button:nth-child(3),
    .TopBar .Left .Button:nth-child(4),
    .TopBar .Left .Button:nth-child(5) { display: none; }
    .Cover { padding: .5rem 0; }
    .Cover .Content .Middle { width: min(82vw, 320px); }
  }
  /* ── 手机端重做 (竖屏 ≤600px): crest 核心 + 链接式介绍 ─────────── */
  @media (max-width: 600px) {
    html { font-size: 13px; }

    /* 页眉：只留 RHINE LAB 品牌, 左对齐; 站内链接全部移入正文 */
    .TopBar { position: relative; height: 44px; animation: none; }
    .TopBar .Placeholder,
    .TopBar .PlaceholderMiddle,
    .TopBar .Right { display: none; }
    .TopBar .Left { padding: 0 1rem; overflow: visible; align-items: center; }
    .TopBar .Left .Logo { margin-right: 0; padding: 0; }
    .TopBar .Left .Logo .Image { height: 1.55rem; transform: none; }
    .TopBar .Left .Logo .Text { font-size: .98rem; letter-spacing: .14em; }
    .TopBar .Left .Button { display: none !important; }

    .Cover {
      display: block; background: #eef0db;
      min-height: calc(100svh - 44px); min-height: calc(100dvh - 44px);
      padding: 0; animation: none;
    }
    .Cover .Content {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
      width: 100%;
      min-height: calc(100svh - 44px); min-height: calc(100dvh - 44px);
      aspect-ratio: auto; box-sizing: border-box;
      background: #eef0db;
      transform: none; animation: none;
      overflow: hidden;
      padding: 0 1.4rem 2rem;
    }

    /* 律动方块：退为极淡的左上背景, crest 之后淡入 */
    .Cover .Content .Middle {
      position: absolute; top: -1vh; left: -22vw;
      width: 86vw; height: 86vw;
      max-width: 400px; max-height: 400px;
      margin: 0; z-index: 0;
      pointer-events: none; overflow: hidden;
      opacity: 0; animation: phoneBlocksIn 1.1s ease-out .9s both;
    }
    .Cover .Content .Middle .Center { width: 100%; height: 100%; }
    .Center .Circle, .Center .Line { display: none; }
    .Cover .Content .Middle .Block { opacity: 1; transition: none; }
    @keyframes phoneBlocksIn { from { opacity: 0; } to { opacity: .28; } }

    /* crest：核心元素, 纯 CSS 缩放入场 (不走 JS 手绘) */
    .RhineLogoWrap {
      display: block; position: relative; top: auto; left: auto;
      width: min(80vw, 380px); height: auto;
      margin: clamp(14px, 5vh, 44px) auto 0;
      z-index: 2; pointer-events: none;
      filter: drop-shadow(0 14px 24px rgba(0,0,0,.18)) drop-shadow(0 2px 5px rgba(0,200,70,.14));
      animation: phoneCrestIn .9s cubic-bezier(.22,.61,.36,1) both;
    }
    .RhineLogoWrap svg { width: 100%; height: auto; display: block; }
    .RhineLogoWrap .drawMasked { mask: none !important; -webkit-mask: none !important; }
    .RhineLogoWrap .logoPlus,
    .RhineLogoWrap .logoMinus,
    .RhineLogoWrap .logoText { opacity: 1 !important; }

    /* 文字列：ADAYDREAM → 副标语 → 链接+描述 → 音乐开关 */
    .Cover .Content .Left {
      position: relative; z-index: 2;
      width: 100%; max-width: 430px; flex: none;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      padding: 0;
      margin-top: clamp(26px, 10vh, 104px);
    }
    .Cover .Content .Left .Title,
    .Cover .Content .Left .Tip,
    .Cover .Content .Left .Buttons { position: static; top: auto; left: auto; }
    .Cover .Content .Left .Title {
      margin: 0;
      font-size: clamp(22px, 7.4vw, 32px); font-weight: 700;
      letter-spacing: .18em; color: #000;
      animation: phoneTextIn .7s ease-out .5s both;
    }
    .Cover .Content .Left .Tip {
      margin: 8px 0 0;
      font-size: clamp(11px, 3.4vw, 14px); color: #8a8d78;
      letter-spacing: .05em; line-height: 1.6;
      animation: phoneTextIn .7s ease-out .62s both;
    }
    .PhoneIntro {
      display: flex; flex-direction: column; align-items: center; gap: 11px;
      margin-top: clamp(16px, 4.4vh, 32px);
      animation: phoneTextIn .7s ease-out .74s both;
    }
    .PhoneIntro .PIRow {
      display: flex; flex-wrap: wrap; justify-content: center;
      align-items: baseline; font-size: clamp(13px, 3.9vw, 16px); line-height: 1.55;
    }
    .PhoneIntro .PIName {
      color: #000; font-weight: 700; text-decoration: none;
      border-bottom: 1px solid #000; padding-bottom: 1px;
    }
    .PhoneIntro .PIName:active { background: rgba(0,200,70,.13); }
    .PhoneIntro .PIDash { color: #b1b498; margin: 0 .38em; }
    .PhoneIntro .PIDesc { color: #555; }

    .Cover .Content .Left .Buttons {
      margin: clamp(16px, 4.6vh, 34px) 0 0; gap: .7rem;
      animation: phoneTextIn .7s ease-out .86s both;
    }

  window.addEventListener('DOMContentLoaded', () => {
    // 背景音乐开关
    const t = document.getElementById('bgm-toggle');
    const m = document.getElementById('bgm');
    if (t && m) {
      t.addEventListener('click', () => {
        if (m.paused) { m.play(); t.textContent = 'pauce'; }
        else { m.pause(); t.textContent = 'start'; }
      });
    }

    // 背景乐走本站 /audio/<cid> 接口，服务端现取新鲜直链 302 跳转，规避 HyCDN 签名 3 小时过期
    if (m) {
      m.src = '/audio/880337';
    }

    // Blocks staggered reveal
    const blocks = document.querySelectorAll('.Blocks .Block');
    blocks.forEach((block, i) => {
      setTimeout(() => { block.classList.add('Visible'); }, 1800 + i * 60);
    });

    // 手机布局（竖屏 ≤600 或矮横屏）: crest 走 CSS 静态缩放入场, 不走 JS 手绘
    const isPhoneLayout =
      window.matchMedia('(max-width: 600px)').matches ||
      window.matchMedia('(orientation: landscape) and (max-height: 560px) and (max-width: 1024px)').matches;

    // Rhine logo — hand-drawn ribbon, single pen, montage pacing (仅桌面/平板)
    const logoSvg = document.querySelector('.RhineLogoWrap svg');
    if (!isPhoneLayout && logoSvg) {
      const drawPath  = logoSvg.querySelector('.drawPath');
      const penDot    = logoSvg.querySelector('.penDot');
      const maskedG   = logoSvg.querySelector('.drawMasked');
      const plus  = logoSvg.querySelector('.logoPlus');
      const minus = logoSvg.querySelector('.logoMinus');
      const label = logoSvg.querySelector('.logoText');
      if (drawPath && maskedG) {
        const L = drawPath.getTotalLength();
        drawPath.style.strokeDasharray  = L;
        drawPath.style.strokeDashoffset = L;
        const START_DELAY = 3800;  // center blueprint animation finishes first
        const DURATION    = 2400;
        const easeIn = t => Math.pow(t, 2.4);  // slow start -> fast finish
        setTimeout(() => {
          if (penDot) penDot.setAttribute('r', 45);  // pen touches down
          const t0 = performance.now();
          const frame = now => {
            const t = Math.min((now - t0) / DURATION, 1);
            const e = easeIn(t);
            drawPath.style.strokeDashoffset = L * (1 - e);
            if (penDot) {
              const pt = drawPath.getPointAtLength(Math.max(L * e, 0.01));
              penDot.setAttribute('cx', pt.x);
              penDot.setAttribute('cy', pt.y);
            }
            if (t < 1) {
              requestAnimationFrame(frame);
            } else {
              if (penDot) penDot.setAttribute('r', 0);
              maskedG.removeAttribute('mask');  // settle to final artwork
              // slow finale — back to the opening tempo for + / - / text
              const slow = { duration: 1800, easing: 'cubic-bezier(.22,.61,.36,1)', fill: 'forwards' };
              if (plus)  plus.animate(
                [{opacity: 0, transform: 'translateY(30px)'}, {opacity: 1, transform: 'translateY(0)'}],
                Object.assign({delay: 150}, slow));
              if (minus) minus.animate(
                [{opacity: 0, transform: 'translateY(30px)'}, {opacity: 1, transform: 'translateY(0)'}],
                Object.assign({delay: 400}, slow));
              if (label) label.animate(
                [{opacity: 0, clipPath: 'inset(0 0 0 100%)'}, {opacity: 1, clipPath: 'inset(0 0 0 0)'}],
                Object.assign({delay: 650}, slow));
            }
          };
          requestAnimationFrame(frame);
        }, START_DELAY);
      }
    }
  });
</script>
<audio id="bgm" loop preload="none"></audio>

</body>
</html>
