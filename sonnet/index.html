<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rhine Lab — Ask the lab anything.</title>
<meta name="description" content="Rhine Lab — a quiet local-model chat.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&display=block" rel="stylesheet">
<style>
/* ============================= RESET ============================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
button, input, textarea { font: inherit; color: inherit; background: none; border: 0; }
img, svg { display: block; }

/* ============================= TOKENS ============================= */
:root {
  --u: min(0.06410256vw, 0.12400794vh);
  --vu: 0.09920635vh;
  --inset-top: 41; --inset-bottom: 106;

  --font-text: Inter, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-display: Inter, var(--font-text);

  /* accent — Rhine Lab green */
  --green: #00C846;
  --green-hi: #4FE387;
  --green-mid: #14C94F;
  --green-lo: #049B39;

  /* nav */
  --brand-x:225; --brand-y:45; --mark:36; --mark-w:76; --brand-gap:12; --brand-fs:18.49;
  --links-y:50.5; --links-gap:50; --links-fs:21.69;
  --cta-x:1195; --cta-y:42; --cta-w:140; --cta-h:43; --cta-r:12; --cta-fs:15.70; --cta-dy:2;
  /* hero */
  --hero-gap:51;
  --h1-y:323; --h1-fs:36.25; --display-ls:0.0018em;
  --nav-ls:-0.0115em; --brand-ls:-0.0154em; --cta-ls:-0.0127em; --body-ls:0.007em;
  --label-ls:normal; --model-ls:normal; --proof-ls:0.0065em;
  --w-regular:400; --w-display-wght:410; --w-medium:500; --w-semibold:600;
  --w-display:var(--w-display-wght); --w-nav:400; --w-brand:500; --w-cta:520;
  --w-body:var(--w-regular); --w-label:var(--w-medium);
  --w-model:var(--w-regular); --w-proof:480;
  /* composer */
  --card-x:425; --card-y:413; --card-w:708; --card-h:143; --card-r:26;
  --ph-x:452; --ph-y:446; --ph-fs:9.97;
  --chips-x:444; --chips-y:505; --chip-h:30; --chip-r:9; --chip-fs:9.0; --chip-gap:5.5;
  --son-fs:10.4; --son-top:15.5; --chev-gap:6.2;
  --chev-x:1013.5; --chev-y:522.3;
  --att-x:1043.2; --att-y:515.1;
  --send-x:1084; --send-y:507; --send-d:35;
  /* footer */
  --by-y:799; --by-fs:14.01; --logo-y:867; --logo-gap:62;

  /* easing */
  --e-primary: cubic-bezier(.16, 1, .3, 1);
  --e-soft: cubic-bezier(.22, 1, .36, 1);
}
@supports (height: 100dvh) {
  :root { --u: min(0.06410256vw, 0.12400794dvh); --vu: 0.09920635dvh; }
}
@media (min-width: 1561px) {
  :root { --inset-top: 27; --inset-bottom: 74; }
}

html, body { height: 100%; }
body {
  overflow: hidden;
  background: #0a0d12;
  color: #fff;
  font-family: var(--font-text);
  font-synthesis: none;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: geometricPrecision;
}

:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }

/* ============================= STAGE ============================= */
.stage { position: fixed; inset: 0; overflow: hidden; background: #0a0d12; }
.stage-video {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; z-index: 0;
}
/* dark scrim so white text always stands out over any footage */
.stage::after {
  content: ""; position: absolute; inset: 0; z-index: 0;
  background: radial-gradient(120% 90% at 50% 40%, rgba(10,13,18,.18) 0%, rgba(10,13,18,.62) 100%);
}
.frame {
  position: absolute; inset: 0; z-index: 1;
  display: flex; flex-direction: column;
  padding: calc(var(--inset-top) * var(--vu)) calc(225 * var(--u)) calc(var(--inset-bottom) * var(--vu));
}

/* ============================= NAV ============================= */
.nav {
  position: relative;
  flex: none;
  height: calc(43 * var(--u));
  display: flex; align-items: center; justify-content: space-between;
}
.brand {
  display: flex; align-items: center; gap: calc(var(--brand-gap) * var(--u));
  text-decoration: none; color: #fff;
}
.brand .mark { width: calc(var(--mark-w) * var(--u)); height: calc(var(--mark) * var(--u)); }
.brand .wordmark {
  font-size: calc(var(--brand-fs) * var(--u));
  font-weight: var(--w-brand);
  letter-spacing: var(--brand-ls);
  line-height: 1;
  transform: translateY(calc(1 * var(--u)));
  font-variation-settings: "opsz" 32;
  text-shadow: 0 calc(1 * var(--u)) calc(10 * var(--u)) rgba(0, 0, 0, .30);
}

.links {
  position: absolute; left: 50%; transform: translateX(-50%);
  top: calc((50.5 - 41) * var(--u));
  display: flex; gap: calc(var(--links-gap) * var(--u));
}
.links a {
  font-size: calc(var(--links-fs) * var(--u));
  font-weight: var(--w-nav);
  letter-spacing: var(--nav-ls);
  line-height: 1.2;
  color: #fff; text-decoration: none;
  text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .32);
  padding: calc(8 * var(--u)) calc(16 * var(--u));
  margin: calc(-8 * var(--u)) calc(-16 * var(--u));
  border-radius: calc(999 * var(--u));
  transition: background .22s ease, box-shadow .22s ease, backdrop-filter .22s ease;
}
/* frosted-glass emphasis on hover */
.links a:hover {
  background: rgba(255, 255, 255, .11);
  backdrop-filter: blur(calc(14 * var(--u))) saturate(150%);
  -webkit-backdrop-filter: blur(calc(14 * var(--u))) saturate(150%);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .13);
  color: #fff;
}

.cta {
  align-self: flex-start;
  margin-top: calc((42 - 41) * var(--u));
  width: calc(var(--cta-w) * var(--u)); height: calc(var(--cta-h) * var(--u));
  border-radius: calc(var(--cta-r) * var(--u));
  font-size: calc(var(--cta-fs) * var(--u));
  font-weight: var(--w-cta);
  letter-spacing: var(--cta-ls);
  color: #fff; text-decoration: none;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
  box-shadow: inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, .10), 0 calc(2 * var(--u)) calc(14 * var(--u)) rgba(0, 0, 0, .28);
  cursor: pointer;
  transition: filter .18s ease, transform .18s ease;
}
.cta span { transform: translateY(calc(2 * var(--u))); }
.cta:hover { filter: brightness(1.16); }
.cta:active { transform: translateY(1px); }

.burger {
  display: none;
  width: 38px; height: 38px; border-radius: 11px;
  background: rgba(255, 255, 255, .10);
  border: 1px solid rgba(255, 255, 255, .14);
  align-items: center; justify-content: center;
  cursor: pointer;
}
.burger svg { width: 17px; height: 12px; }

.sheet { display: none; }

/* ============================= HERO ============================= */
.hero {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: calc(var(--hero-gap) * var(--vu));
  padding-bottom: calc(4 * var(--vu));
}
.h1 {
  font-size: calc(var(--h1-fs) * var(--u));
  font-weight: var(--w-display);
  line-height: 1.10;
  letter-spacing: var(--display-ls);
  color: #fff;
  font-variation-settings: "opsz" 32;
  text-shadow: 0 calc(2 * var(--u)) calc(22 * var(--u)) rgba(0, 0, 0, .30);
  text-align: center;
}

/* ============================= COMPOSER ============================= */
.card {
  position: relative;
  width: calc(var(--card-w) * var(--u)); height: calc(var(--card-h) * var(--u));
  margin-right: calc(3 * var(--u));
  border-radius: calc(var(--card-r) * var(--u));
  background: rgba(41, 41, 43, .955);
  backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
  -webkit-backdrop-filter: blur(calc(26 * var(--u))) saturate(112%);
  box-shadow: inset 0 0 0 1px rgba(214, 228, 255, .14), 0 calc(22 * var(--u)) calc(60 * var(--u)) rgba(0, 0, 0, .30);
}

.ph {
  position: absolute;
  left: calc(27 * var(--u)); top: calc(33 * var(--u)); right: calc(24 * var(--u));
  color: #fff;
  caret-color: var(--green);
  font-size: calc(var(--ph-fs) * var(--u));
  font-weight: var(--w-body);
  line-height: 1.35;
  letter-spacing: var(--body-ls);
  white-space: nowrap; overflow: hidden;
}
.ph::placeholder { color: #8B8C8E; }

.tools {
  position: absolute;
  left: calc(19 * var(--u)); top: calc(92 * var(--u));
  right: calc(-1 * var(--u));
  height: calc(30 * var(--u));
}

/* RIGHT CLUSTER — desktop absolute coordinates (frame-x relative to .tools left = 444) */
.right { position: absolute; inset: 0; pointer-events: none; }
.right > * { position: absolute; pointer-events: auto; }
.model {
  left: calc(510.2 * var(--u));
  top: calc(15.5 * var(--u));
  font-size: calc(10.4 * var(--u));
  font-weight: var(--w-model);
  color: #C7C8CB;
  line-height: 1;
  display: inline-flex; align-items: center; gap: calc(var(--chev-gap) * var(--u));
  white-space: nowrap;
}
.model svg { width: calc(6.8 * var(--u)); height: auto; }
.attach {
  left: calc(599.15 * var(--u));
  top: calc(10.14 * var(--u));
  color: #B4B5B8;
  cursor: pointer;
  display: inline-flex;
  transition: color .18s ease;
}
.attach svg { width: calc(19.79 * var(--u)); height: auto; }
.attach:hover { color: #fff; }
.send {
  left: calc(640 * var(--u));
  top: calc(2 * var(--u));
  width: calc(35 * var(--u)); height: calc(35 * var(--u));
  border-radius: 50%;
  background: linear-gradient(163deg, var(--green-hi) 0%, var(--green-mid) 46%, var(--green-lo) 100%);
  box-shadow: 0 calc(3 * var(--u)) calc(12 * var(--u)) rgba(0, 170, 70, .36);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: filter .18s ease, transform .18s ease;
}
.send svg { width: calc(11.66 * var(--u)); height: auto; }
.send:hover { filter: brightness(1.07); }
.send:active { transform: scale(.95); }

/* ============================= CHAT THREAD ============================= */
.thread {
  display: none;
  width: calc(var(--card-w) * var(--u));
  margin-right: calc(3 * var(--u));
}
.hero.chatting { justify-content: flex-end; gap: calc(16 * var(--vu)); min-height: 0; }
.hero.chatting .h1 { display: none; }
.hero.chatting .thread {
  display: flex;
  flex-direction: column;
  gap: calc(14 * var(--u));
  flex: 1; min-height: 0;
  overflow-y: auto;
  padding: calc(2 * var(--u));
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, .22) transparent;
}
.msg {
  max-width: 82%;
  padding: calc(11 * var(--u)) calc(16 * var(--u));
  border-radius: calc(15 * var(--u));
  font-size: calc(14.5 * var(--u));
  line-height: 1.52;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-wrap: anywhere;
}
.msg.user {
  align-self: flex-end;
  background: rgba(0, 200, 70, .15);
  border: 1px solid rgba(0, 200, 70, .30);
  color: #fff;
}
.msg.assistant {
  align-self: flex-start;
  background: rgba(255, 255, 255, .055);
  border: 1px solid rgba(255, 255, 255, .10);
  color: #EDEEF0;
}
.msg.assistant.pending:empty::after {
  content: '▍';
  color: var(--green);
  animation: chat-blink 1s steps(2) infinite;
}
@keyframes chat-blink { 50% { opacity: 0; } }
@media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
  .thread { width: min(100%, clamp(516px, 74vw, 760px)); margin-right: 0; }
  .msg { font-size: clamp(12px, 1.5vw, 14.5px); }
}
@media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
  .thread { width: 100%; max-width: 600px; margin-right: 0; }
  .msg { font-size: clamp(12px, 3.4vw, 14.5px); padding: 10px 13px; }
}

/* ============================= FOOTER ============================= */
.proof { flex: none; display: flex; flex-direction: column; align-items: center; gap: calc(52.3 * var(--vu)); }
.by {
  font-size: calc(var(--by-fs) * var(--u));
  font-weight: var(--w-proof);
  letter-spacing: var(--proof-ls);
  color: rgba(255, 255, 255, .95);
  font-variation-settings: "opsz" 32;
  text-shadow: 0 calc(1 * var(--u)) calc(12 * var(--u)) rgba(0, 0, 0, .35);
}

/* ============================= ENTRANCE ============================= */
.h1, .card { will-change: transform, opacity; }
@media (prefers-reduced-motion: no-preference) {
  @keyframes e-settle-down { from { opacity: 0; transform: translateY(calc(-5 * var(--u))); } to { opacity: 1; transform: none; } }
  @keyframes e-settle-up   { from { opacity: 0; transform: translateY(calc(6 * var(--u))); }  to { opacity: 1; transform: none; } }
  @keyframes e-mark        { from { transform: scale(.9); }                                  to { transform: none; } }
  @keyframes e-focus       { from { opacity: 0; transform: translateY(calc(14 * var(--u))); filter: blur(calc(6 * var(--u))); } to { opacity: 1; transform: none; filter: blur(0); } }
  @keyframes e-panel       { from { opacity: 0; transform: translateY(calc(18 * var(--u))) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes e-populate    { from { opacity: 0; transform: translateY(calc(4 * var(--u))); }  to { opacity: 1; transform: none; } }
  @keyframes e-send        { from { transform: scale(.82); }                                 to { transform: none; } }

  html.anim .brand                 { animation: e-settle-down .58s var(--e-soft)    .06s both; }
  html.anim .brand .mark           { animation: e-mark        .62s var(--e-primary) .06s both; }
  html.anim .links a:nth-child(1)  { animation: e-settle-down .50s var(--e-soft)    .16s both; }
  html.anim .links a:nth-child(2)  { animation: e-settle-down .50s var(--e-soft)    .21s both; }
  html.anim .links a:nth-child(3)  { animation: e-settle-down .50s var(--e-soft)    .26s both; }
  html.anim .cta                   { animation: e-settle-down .55s var(--e-soft)    .34s both; }
  html.anim .h1                    { animation: e-focus       1.00s var(--e-primary) .30s both; }
  html.anim .card                  { animation: e-panel       .90s var(--e-primary) .62s both; }
  html.anim .ph                    { animation: e-populate    .50s var(--e-soft)    .88s both; }
  html.anim .right                 { animation: e-populate    .50s var(--e-soft)    1.00s both; }
  html.anim .send                  { animation: e-send        .50s var(--e-primary) 1.00s both; }
  html.anim .by                    { animation: e-settle-up   .55s var(--e-soft)    1.08s both; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
}

/* ============================= TABLET ============================= */
@media (min-width: 600px) and (max-width: 1180px) and (min-height: 600px) {
  :root { --u: 1px; }
  .frame {
    padding: clamp(24px, 3.4vh, 44px) clamp(28px, 4.2vw, 60px) clamp(26px, 4.4vh, 56px);
  }
  .h1 { font-size: clamp(27px, 4.3vw, 44px); line-height: 1.12; }
  .card {
    width: min(100%, clamp(516px, 74vw, 760px));
    height: auto;
    margin-right: 0;
    padding: clamp(15px, 1.9vw, 24px);
    border-radius: clamp(17px, 2.1vw, 26px);
    display: flex; flex-direction: column;
    gap: clamp(20px, 3.2vh, 44px);
  }
  .ph { position: static; white-space: normal; font-size: clamp(11px, 1.35vw, 14px); line-height: 1.4; }
  .tools { position: static; height: auto; display: flex; flex-direction: row; flex-wrap: wrap; gap: clamp(10px, 1.4vw, 18px); }
  .right { position: static; display: flex; align-items: center; margin-left: auto; gap: 0; }
  .right > * { position: static; }
  .model { font-size: clamp(9.8px, 1.12vw, 12.5px); }
  .attach { margin-left: clamp(9px, 1.4vw, 20px); }
  .send { margin-left: clamp(9px, 1.3vw, 18px); width: clamp(32px, 3.5vw, 38px); height: clamp(32px, 3.5vw, 38px); }
  .proof { gap: clamp(15px, 2.5vh, 30px); }
}

/* ============================= COMPACT ============================= */
@media (max-width: 599px), (max-height: 599px) and (max-width: 1180px) {
  :root { --u: 1px; }
  .frame {
    padding:
      max(18px, env(safe-area-inset-top))
      max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-right))
      max(20px, env(safe-area-inset-bottom))
      max(clamp(18px, 5.2vw, 40px), env(safe-area-inset-left));
  }
  .links { display: none; }
  .nav .cta { display: none; }
  .burger { display: flex; }
  .brand .mark { width: 64px; height: 30px; }

  .sheet {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows .32s cubic-bezier(.4, 0, .2, 1);
  }
  #menu:checked ~ .sheet { grid-template-rows: 1fr; }
  .sheet-inner {
    overflow: hidden;
    background: rgba(24, 24, 27, .86);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, .09);
    display: flex; flex-direction: column; gap: 4px;
    padding: 12px;
  }
  .sheet-inner a { font-size: 15px; color: #fff; text-decoration: none; padding: 10px 12px; border-radius: 8px; }
  .sheet-inner a:hover { background: rgba(255, 255, 255, .08); }
  .sheet-cta {
    height: 40px; border-radius: 11px; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #3d3d3f 0%, #1d1d20 100%);
    margin-top: 6px;
  }

  .h1 { width: 100%; max-width: 15ch; font-size: clamp(29px, 7.6vw, 50px); line-height: 1.14; letter-spacing: -.012em; }
  .card {
    width: 100%; max-width: 600px;
    height: auto;
    display: flex; flex-direction: column;
    gap: clamp(16px, 4.6vh, 34px);
    padding: clamp(13px, 3.4vw, 18px);
    margin-right: 0;
  }
  .ph { position: static; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: clamp(9.4px, 2.95vw, 14px); }
  .tools { position: static; height: auto; display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
  .right { position: static; display: flex; align-items: center; justify-content: flex-start; }
  .right > * { position: static; }
  .attach { margin-left: auto; }
  .send { margin-left: 14px; width: 40px; height: 40px; }
}

/* Extra short */
@media (max-width: 1180px) and (max-height: 560px) {
  .hero { gap: 16px; padding-top: 10px; }
  .h1 { font-size: clamp(24px, 5.4vh, 34px); }
  .proof { gap: 10px; }
}
</style>
<script>document.documentElement.classList.add('anim');</script>
</head>
<body>
<div class="stage">
  <video class="stage-video" src="bg.mp4" autoplay muted loop playsinline></video>
  <div class="frame">
    <input type="checkbox" id="menu" hidden>

    <header class="nav">
      <a class="brand" href="#" aria-label="Rhine Lab home">
        <svg class="mark" viewBox="490 320 945 445" aria-hidden="true">
          <defs>
            <linearGradient id="rhineSat" gradientUnits="userSpaceOnUse" x1="960" y1="330" x2="960" y2="745">
              <stop offset="0%"   stop-color="#00C846" stop-opacity="1.00"/>
              <stop offset="16%"   stop-color="#00C846" stop-opacity="0.88"/>
              <stop offset="33%"   stop-color="#00C846" stop-opacity="0.77"/>
              <stop offset="50%"   stop-color="#00C846" stop-opacity="0.65"/>
              <stop offset="66%"   stop-color="#00C846" stop-opacity="0.53"/>
              <stop offset="83%"   stop-color="#00C846" stop-opacity="0.42"/>
              <stop offset="100%"   stop-color="#00C846" stop-opacity="0.30"/>
            </linearGradient>
          </defs>

        <input class="ph" type="text" placeholder="Message Rhine Lab…" autocomplete="off" spellcheck="false">
        <div class="tools">
          <div class="right">
            <span class="model">Qwen2.5 1.5B
              <svg viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 1l4 4 4-4"/>
              </svg>
            </span>

              </svg>
            </button>
            <button type="button" class="send" aria-label="Send">
              <svg viewBox="0 0 12 12" fill="#fff" aria-hidden="true">

<script>
(function () {
  var root = document.documentElement;
  var done = false;
  function teardown() { if (done) return; done = true; root.classList.remove('anim'); }
  setTimeout(teardown, 2600);
})();

/* click anywhere on the composer focuses the input */
(function () {
  var card = document.querySelector('.card');
  var ph = document.querySelector('.ph');
  if (card && ph) card.addEventListener('click', function (e) { if (e.target !== ph) ph.focus(); });
})();

/* chat wiring — stream /v1/chat/completions (SSE) into the thread */
(function () {
  var form = document.querySelector('.card');
  var input = document.querySelector('.ph');
  var sendBtn = document.querySelector('.send');
  var hero = document.querySelector('.hero');
  var thread = document.querySelector('.thread');
  if (!form || !input || !sendBtn || !hero || !thread) return;

  var MODEL = 'qwen2.5-1.5b-instruct';
  var history = [];
  var busy = false;

  function scrollDown() { thread.scrollTop = thread.scrollHeight; }

  function addMsg(role, text) {
    var el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    thread.appendChild(el);
    scrollDown();
    return el;
  }

  function setBusy(b) {
    busy = b;
    sendBtn.style.opacity = b ? '0.45' : '1';
    sendBtn.style.pointerEvents = b ? 'none' : 'auto';
  }

  async function send() {
    var text = input.value.trim();
    if (!text || busy) return;
    hero.classList.add('chatting');
    addMsg('user', text);
    history.push({ role: 'user', content: text });
    input.value = '';
    setBusy(true);

    var replyEl = addMsg('assistant', '');
    replyEl.classList.add('pending');
    var full = '';

    try {
      var res = await fetch('/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: MODEL,
          messages: [{ role: 'system', content: 'You are Rhine Lab, a concise and helpful assistant. Reply in the same language the user writes in.' }].concat(history),
          stream: true,
          temperature: 0.7,
          max_tokens: 512
        })
      });

      if (!res.ok) {
        var detail = '';
        try { var j = await res.json(); detail = j && j.error && j.error.message ? j.error.message : ''; } catch (e) {}
        throw new Error('HTTP ' + res.status + (detail ? ' — ' + detail : ''));
      }

      var reader = res.body.getReader();
      var decoder = new TextDecoder('utf-8');
      var buf = '';
      var done = false;

      while (!done) {
        var r = await reader.read();
        if (r.done) break;
        buf += decoder.decode(r.value, { stream: true });
        var lines = buf.split('\n');
        buf = lines.pop();
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].trim();
          if (line.indexOf('data:') !== 0) continue;
          var payload = line.slice(5).trim();
          if (payload === '[DONE]') { done = true; break; }
          try {
            var obj = JSON.parse(payload);
            var delta = obj.choices && obj.choices[0] && obj.choices[0].delta;
            var tok = delta && (delta.content || '');
            if (tok) { full += tok; replyEl.textContent = full; scrollDown(); }
          } catch (e) {}
        }
      }
      history.push({ role: 'assistant', content: full });
      if (history.length > 24) history = history.slice(-24);
    } catch (err) {
      replyEl.textContent = '⚠ ' + (err && err.message ? err.message : String(err));
    } finally {
      replyEl.classList.remove('pending');
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener('submit', function (e) { e.preventDefault(); send(); });
  sendBtn.addEventListener('click', function (e) { e.preventDefault(); send(); });
})();
</script>
