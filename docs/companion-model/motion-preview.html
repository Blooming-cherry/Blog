<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>05 蓝女仆 · 动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f3ef;color:#253447;font:15px/1.7 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:40px 24px}h1{font-size:28px;margin:0}p{color:#647082}header{margin-bottom:24px}.layout{display:grid;grid-template-columns:minmax(300px,1fr) 280px;gap:24px}.stage{background:#fff;border:1px solid #dce2e8;border-radius:20px;min-height:510px;display:grid;place-items:center;position:relative;overflow:hidden}.stage.dark{background:#162433}canvas{width:min(100%,440px);height:auto;touch-action:pan-y;cursor:pointer}aside{padding:20px;background:#fff;border:1px solid #dce2e8;border-radius:20px}button,select{font:inherit;min-height:44px;padding:8px 12px;border:1px solid #c6d2df;border-radius:9px;background:#fff;color:#253447}button:focus-visible,select:focus-visible{outline:3px solid #70bafa;outline-offset:3px}button{cursor:pointer}button:hover{background:#edf5fc}.actions{display:flex;flex-wrap:wrap;gap:8px}label{display:block;margin:16px 0}input{accent-color:#347ac0}small{display:block;color:#647082;margin-top:16px}.badge{position:absolute;bottom:12px;font-size:12px;color:#718096}#status{min-height:26px}details{margin-top:24px}li{margin:8px 0}@media(max-width:700px){main{padding:22px 14px}.layout{grid-template-columns:1fr}.stage{min-height:360px}canvas{max-width:340px}}
</style>
<main><header><h1>05 蓝女仆 · 动作预览</h1><p>校正版原设定 · 呼吸、眨眼、轻摆与点击回应</p></header>
<div class="layout"><section class="stage" id="stage" aria-label="动态形象预览"><canvas id="model" width="880" height="880" tabindex="0" role="button" aria-label="点击或按回车让看板娘回应"></canvas><span class="badge">本地贴图动作样机 · 尚未导出 Cubism 模型</span></section>
<aside><div class="actions"><button data-motion="blink">眨眼</button><button data-motion="nod">点头</button><button data-motion="happy">开心回应</button><button data-motion="tail">摆尾</button></div>
<label><input id="playing" type="checkbox" checked> 播放待机动作</label><label><input id="follow" type="checkbox" checked> 视线跟随指针</label><label><input id="dark" type="checkbox"> 深色背景</label><label>显示尺寸 <select id="size"><option value="440">大图检查</option><option value="270">博客 270 px</option><option value="220">博客 220 px</option></select></label><p id="status" role="status">正在载入校正版…</p><small>遵循系统“减少动态效果”；页面隐藏时停止绘制。点击与键盘操作均可触发回应。</small></aside></div>
<details><summary>当前完成状态</summary><ul><li>使用已通过的校正版原图，通过运行时网格和局部纹理变形预览动作节奏。</li><li>眨眼与视线使用局部贴图变形；尚不具备独立眼睑、瞳孔和口型图层。</li><li>发尾、鲸尾为区域变形，尚未完成遮挡补绘与 Cubism 物理绑定。</li><li>本预览用于检查动作幅度与交互，不作为正式 Live2D 模型验收。</li></ul></details></main><script src="motion-preview.js"></script></html>
