name: Deploy Terminal Page

on:
  push:
    branches:
      - main
    paths:
      - 'terminal/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy terminal page to cloud server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" terminal/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/adaydream/
