name: Deploy Hexo Blog
permissions:
  contents: write
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: technical

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build Hexo
        run: npx hexo generate

      - name: Deploy to cloud server
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # prose/ 不归 Hexo 管：它是文苑栏目，由 deploy-prose.yml 单独同步。
          # 这条 rsync 带 --delete，不排除的话每次博客构建都会把整个文苑抹掉。
          rsync -avz --delete --exclude='.well-known/' --exclude='music.json' --exclude='prose/' -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" public/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/
