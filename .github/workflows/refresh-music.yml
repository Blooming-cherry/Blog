name: Refresh Music JSON

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch fresh Monster Siren URLs
        run: node adaydream-proxy/fetch-music.mjs > music.json

      - name: Validate music.json
        run: |
          node -e "const j=require('./music.json'); if(j.code!==0 || !Array.isArray(j.data) || !j.data.length || !j.data.some(s=>s.cid==='880337')){ console.error('invalid music.json'); process.exit(1) } console.log('OK: '+j.data.length+' songs')"
          wc -c music.json

      - name: Deploy music.json to both sites
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" music.json ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/adaydream/music.json
          rsync -avz -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" music.json ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/blog/music.json
